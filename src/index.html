<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval';
      style-src 'self' 'unsafe-inline';
      font-src 'self' data:;
      img-src 'self' data: blob: filesystem:;
      connect-src 'self';
      frame-src 'self';
      worker-src 'self' blob:;
      child-src 'self';
    ">
    <title>FoxyPDF</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/theme.css">
    <script src="js/theme-list.js"></script>
    <script src="js/theme-boot.js"></script>
</head>

<body>
    <nav id="customMenubar" role="menubar" aria-label="Application menu">
        <div class="menu-item" data-menu="file" role="menuitem" tabindex="0" aria-haspopup="true">File</div>
        <div class="menu-item" data-menu="edit" role="menuitem" tabindex="0" aria-haspopup="true">Edit</div>
        <div class="menu-item" data-menu="view" role="menuitem" tabindex="0" aria-haspopup="true">View</div>
        <div class="menu-item" data-menu="settings" role="menuitem" tabindex="0" aria-haspopup="true">Settings</div>
        <div class="menu-item" data-menu="help" role="menuitem" tabindex="0" aria-haspopup="true">Help</div>
        <div id="menubarDropdown" class="menubar-dropdown hidden" role="menu"></div>
        <div id="menubarSubmenu" class="menubar-submenu hidden" role="menu"></div>
    </nav>
    <div id="menubarOverlay" class="hidden"></div>
    <div id='leftSeek'>&lang;</div>
    <div id='tabContainer'></div>
    <div id='rightSeek'>&rang;</div>
    <div id='backgroundInfo'>
        <img id='backgroundLogo' src='assets/images/logo.png' />
        <div id='backgroundText'>
            Open a file from the menu or by pressing Ctrl + O
        </div>
    </div>
    <div id='viewContainer'>
        <iframe id='viewer' sandbox="allow-same-origin allow-scripts" title="PDF viewer"></iframe>
    </div>
    <div id="dropOverlay" class="hidden">
        <div class="drop-box">Drop PDF files to open them</div>
    </div>
    <div id="themePalette" class="theme-palette hidden" role="menu" aria-label="Themes">
        <div class="theme-palette-title">Themes</div>
        <div id="themePaletteList"></div>
        <div class="theme-palette-accents" id="themeAccents" style="display:none"><div class="theme-palette-title" style="margin-top:8px">Accent</div><div id="themeAccentList"></div></div>
    </div>
    <button id="themeFab" class="theme-fab" title="Themes (T)" aria-label="Themes">🎨</button>
    <div id="recentPanel" class="recent-panel hidden" role="menu" aria-label="Recent Files"></div>
    <button id="bookmarkFab" class="bookmark-fab hidden" title="Bookmarks (Ctrl+B)" aria-label="Bookmarks">🔖</button>
    <div id="bookmarkPanel" class="bookmark-panel hidden" role="menu" aria-label="Bookmarks"></div>
    <script src="js/theme-list.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/index.js"></script>
</body>

</html>
