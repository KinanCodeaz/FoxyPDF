    - Added Content-Security-Policy (no remote code, no external network).

      the viewer runs, but cannot open popups, navigate the app, or reach Node).
-->
<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self';">
    <title>Lector</title>
    <link rel="stylesheet" href="css/index.css">
</head>

<body>
    <div id='leftSeek'>&lang;</div>
    <div id='tabContainer'></div>
    <div id='rightSeek'>&rang;</div>
    <div id='backgroundInfo'>
        <img id='backgroundLogo' src='assets/images/grayscale.png' />
        <div id='backgroundText'>
            Open a file from the menu or by pressing Ctrl + O
        </div>
    </div>
    <div id='viewContainer'>
        <iframe id='viewer' sandbox="allow-same-origin allow-scripts" title="PDF viewer"></iframe>
    </div>
    <script src="js/index.js"></script>
</body>

</html>
